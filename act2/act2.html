<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-dark bg-gradient">
  <img src="assets/background.jpg" class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover z-n1">
  <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-25 z-n1"></div>

  <div class="container sticky-top pt-3">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-light bg-opacity-10 border border-light border-opacity-25 rounded-5 shadow px-3">

      <a class="navbar-brand fw-bold" href="#">JSON Website</a>

      <button class="navbar-toggler border-light border-opacity-50" type="button" data-bs-toggle="collapse"
        data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yaoguangglazer.github.io/">Go Back</a></li>
        </ul>
      </div>
    </nav>
  </div>

  <div class="container">
    <div class="row justify-content-center my-5">
      <div class="col-8 col-md-6 col-lg-4">
        <img src="assets/logo.png" class="img-fluid d-block mx-auto" />
      </div>
    </div>

    <div class="row g-4 pb-5" id="parent">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var heroines = [
      {
        firstName: "Tohka",
        lastName: "Yatogami",
        altName: "Princess",
        isSealed: true,
        image: "assets/tohka.jpg",
        powers: [
          { name: "Sandalphon", type: "Angel" },
          { name: "Halvanhelev", type: "Weapon" },
        ],
      },
      {
        firstName: "Origami",
        lastName: "Tobiichi",
        altName: "Angel",
        isSealed: true,
        image: "assets/origami.jpg",
        powers: [
          { name: "Metatron", type: "Angel" },
          { name: "Zadkiel", type: "Weapon" },
        ],
      },
      {
        firstName: "Kurumi",
        lastName: "Tokisaki",
        altName: "Nightmare",
        isSealed: true,
        image: "assets/kurumi.jpg",
        powers: [
          { name: "Zafkiel", type: "Angel" },
          { name: "Time Bullets", type: "Skill" },
        ],
      },
      {
        firstName: "Sawa",
        lastName: "Yamauchi",
        altName: "White Queen",
        isSealed: false,
        image: "assets/queen.jpg",
        powers: [
          { name: "Lucifugus", type: "Angel" },
          { name: "Sartan and Betulah", type: "Skill" },
        ],
      },
      {
        firstName: "Yoshino",
        lastName: "Himekawa",
        altName: "Hermit",
        isSealed: true,
        image: "assets/yoshino.jpg",
        powers: [
          { name: "Zadkiel", type: "Angel" },
          { name: "Yoshinon", type: "Puppet" },
        ],
      },
      {
        firstName: "Kotori",
        lastName: "Itsuka",
        altName: "Efreet",
        isSealed: true,
        image: "assets/kotori.jpg",
        powers: [
          { name: "Camael", type: "Angel" },
          { name: "Fire Power", type: "Skill" },
        ],
      },
      {
        firstName: "Kaguya",
        lastName: "Yamai",
        altName: "Berserk",
        isSealed: true,
        image: "assets/kaguya.jpg",
        powers: [
          { name: "Raphael", type: "Angel" },
          { name: "Wind Spear", type: "Weapon" },
        ],
      },
      {
        firstName: "Yuzuru",
        lastName: "Yamai",
        altName: "Berserk",
        isSealed: true,
        image: "assets/yuzuru.jpg",
        powers: [
          { name: "Raphael", type: "Angel" },
          { name: "Wind Whip", type: "Weapon" },
        ],
      },
      {
        firstName: "Miku",
        lastName: "Izayoi",
        altName: "Diva",
        isSealed: true,
        image: "assets/miku.jpg",
        powers: [
          { name: "Gabriel", type: "Angel" },
          { name: "Song Power", type: "Skill" },
        ],
      },
      {
        firstName: "Natsumi",
        lastName: "Kyouno",
        altName: "Witch",
        isSealed: true,
        image: "assets/natsumi.jpg",
        powers: [
          { name: "Haniel", type: "Angel" },
          { name: "Transform", type: "Skill" },
        ],
      },
      {
        firstName: "Nia",
        lastName: "Honjo",
        altName: "Artisan",
        isSealed: false,
        image: "assets/nia.jpg",
        powers: [
          { name: "Rasiel", type: "Angel" },
          { name: "Book of Secrets", type: "Skill" },
        ],
      },
      {
        firstName: "Mukuro",
        lastName: "Hoshimiya",
        altName: "Midnight",
        isSealed: false,
        image: "assets/mukuro.jpg",
        powers: [
          { name: "Michael", type: "Angel" },
          { name: "Key of Doors", type: "Weapon" },
        ],
      },
    ];

    var elParent = document.getElementById("parent");

    for (var i = 0; i < heroines.length; i++) {
      var status = "";
      if (heroines[i].isSealed == true) {
        status = '<span class="badge text-bg-success">Sealed</span>';
      } else {
        status = '<span class="badge text-bg-warning">Unsealed</span>';
      }

      var powersHtml = "";
      for (var j = 0; j < heroines[i].powers.length; j++) {
        var color = "text-bg-info";
        if (heroines[i].powers[j].type == "Angel") {
          color = "text-bg-danger";
        }
        powersHtml +=
          '<span class="badge ' +
          color +
          ' me-1">' +
          heroines[i].powers[j].name +
          " (" +
          heroines[i].powers[j].type +
          ")</span>";
      }

      elParent.innerHTML +=
        `<div class="col-12 col-md-6 col-lg-4">
          <div class="card text-white shadow-lg rounded-4 border-danger overflow-hidden">
            <div class="ratio ratio-1x1">
              <img src="` +
        heroines[i].image +
        `" class="card-img rounded-0 object-fit-cover "` +
        heroines[i].firstName +
        `" />
            </div>
            <div class="card-img-overlay d-flex flex-column justify-content-end p-0">
              <div class="bg-dark bg-opacity-75 p-3">
                <div class="h3 text-warning">` +
        heroines[i].firstName +
        " " +
        heroines[i].lastName +
        `</div>
                <div class="mb-2">
                  <span class="badge text-bg-secondary">Nickname: ` +
        heroines[i].altName +
        `</span>
                  ` +
        status +
        `
                </div>
                <div>` +
        powersHtml +
        `     </div>
              </div>
            </div>
          </div>
        </div>`;
    }
  </script>
</body>

</html>
