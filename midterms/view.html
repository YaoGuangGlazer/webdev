<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Midterms</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <img src="assets/bg.jpg" class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover z-n1" alt="">
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 z-n1"></div>

    <!-- navbar -->
    <div class="container sticky-top pt-3">
        <nav
            class="navbar navbar-expand-lg navbar-dark bg-light bg-opacity-10 border border-light border-opacity-25 rounded-5 shadow px-3">
            <a class="navbar-brand fw-bold" href="#">API Project</a>
            <button class="navbar-toggler border-light border-opacity-50" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="midterms.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://yaoguangglazer.github.io/">Go Back</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- back -->
    <div class="container mt-4">
        <a href="midterms.html" id="backlink" class="btn btn-outline-light">Back to list</a>
    </div>

    <!-- character -->
    <div class="container mt-3 pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow rounded-5 overflow-hidden text-center">

                    <div id="banner" style="background-color: #F5F5F5; height: 140px;"></div>

                    <div class="card-body p-5 pt-0">
                        <div id="imageContainer" class="mx-auto rounded-circle overflow-hidden border border-5 border-white bg-white shadow"
                            style="width: 240px; height: 240px; margin-top: -120px;">
                            <img src="" class="w-100 h-100 object-fit-cover" id="image" alt="">
                        </div>

                        <div class="h2 fw-bold mt-4 mb-2" id="name">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading</span>
                            </div>
                        </div>

                        <div>
                            <span class="rounded-pill px-4 py-1 text-white bg-dark" id="jpname"></span>
                        </div>

                        <table class="table table-striped mt-4 mb-0 text-start">
                            <tbody id="details"></tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const HARU_URARA = 'https://umapyoi.net/api/v1/character/';

        // elements
        var elName = document.getElementById("name");
        var elJpName = document.getElementById("jpname");
        var elImage = document.getElementById("image");
        var elBanner = document.getElementById("banner");
        var elDetails = document.getElementById("details");
        var elBacklink = document.getElementById("backlink");

        // get id
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const page = urlParams.get('page');

        // go back
        if (page != null) {
            elBacklink.href = "midterms.html?page=" + page;
        }

        // fields to skip (too many/repeated data)
        var skip = ['name_en', 'name_en_internal', 'name_jp', 'thumb_img', 'detail_img_sp', 'sns_icon', 'sns_header', 'color_main', 'color_sub'];
        

        // fetch one horse
        const getHorse = async () => {
            elName.innerHTML = "Loading " + id;

            try {
                const response = await fetch(HARU_URARA + id);
                var c = await response.json();
                if (Array.isArray(c)) {
                    c = c[0];
                }

                var color = c.color_main ? '#' + c.color_main.replace('#', '') : '#F5F5F5';

                elName.innerHTML = c.name_en || c.name_jp;
                elJpName.innerHTML = c.name_jp;
                elImage.src = c.thumb_img;
                elBanner.style.backgroundColor = color;

                elDetails.innerHTML = '';
                for (var key in c) {
                    var value = c[key];
                    var simple = typeof value == 'string' || typeof value == 'number';
                    if (simple && value !== '' && !skip.includes(key)) {
                        elDetails.innerHTML += `
              <tr>
                <th class="text-capitalize">${key.replaceAll('_', ' ')}</th>
                <td>${value}</td>
              </tr>
            `;
                    }
                }
            } catch (error) {
                elName.innerHTML = 'Umamusume could not be found';
            }
        };

        if (id != null) {
            getHorse();
        } else {
            elName.innerHTML = 'Umamusume selected is on vacation.';
        }
    </script>

</body>
</html>
