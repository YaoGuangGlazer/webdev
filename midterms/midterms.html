<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Midterms</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <img src="assets/bg.jpg" class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover z-n1" alt="">
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 z-n1"></div>

    <!-- navbar -->
    <div class="container sticky-top pt-3">
        <nav
            class="navbar navbar-expand-lg navbar-dark bg-light bg-opacity-10 border border-light border-opacity-25 rounded-5 shadow px-3">
            <a class="navbar-brand fw-bold" href="#">API Project</a>
            <button class="navbar-toggler border-light border-opacity-50" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://yaoguangglazer.github.io/">Go Back</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- search -->
    <div class="container pt-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 mt-3">
                <div class="input-group input-group-lg">
                    <input type="search" id="sirch" class="form-control rounded-start-3" placeholder="Search"
                        oninput="searchHorse()">
                    <button class="btn btn-primary px-4 rounded-end-3" type="submit">Search</button>
                </div>
                </form>
            </div>
        </div>
    </div>

    <!-- page nav -->
    <div class="container mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item"><a class="page-link" role="button" onclick="back()">Back</a></li>
                <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
                <li class="page-item"><a class="page-link" role="button" onclick="next()">Next</a></li>
            </ul>
        </nav>
    </div>

    <!-- parent -->
    <div class="container">
        <div id="parent" class="row"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const GOLDSHIP = 'https://umapyoi.net/api/v1/character/list';

        // elements
        var elCurrentPage = document.getElementById("currentpage");
        var elParent = document.getElementById("parent");
        var elSearch = document.getElementById("sirch");

        // variables
        var horses = []; // character
        var show = []; // search func
        var page = 1;
        var perPage = 12;

        // fetch horse data
        const getUmamusume = async () => {
            try {
                const response = await fetch(GOLDSHIP);
                horses = await response.json();
                show = horses;
                showPage();
            } catch (error) {
                elParent.innerHTML = '<div class="alert alert-danger">Where are they?</div>';
            }
        };

        // show characters on page
        function showPage() {
            elParent.innerHTML = '';
            elCurrentPage.innerHTML = page;

            var start = (page - 1) * perPage;
            var end = start + perPage;

            for (var i = start; i < end && i < show.length; i++) {
                var c = show[i];
                var color = c.color_main ? '#' + c.color_main.replace('#', '') : '#F5F5F5';

                elParent.innerHTML += `
                    <div class="col-4 my-3">
                        <div class="card border-0 shadow h-100 overflow-hidden text-center">
                        <div style="background-color: ${color}; height: 90px;"></div>
                        <div class="card-body d-flex flex-column align-items-center pt-0">
                            <div class="rounded-circle overflow-hidden border border-4 border-white bg-white shadow-sm"
                            style="width: 120px; height: 120px; margin-top: -60px;">
                            <img class="w-100 h-100 object-fit-cover" src="${c.thumb_img}" alt="${c.name_en}">
                            </div>
                            <span class="badge text-bg-dark mt-3">#${c.game_id}</span>
                            <div class="h5 fw-bold mt-2 mb-3">${c.name_en}</div>
                            <div class="rounded-pill px-4 py-1 mt-auto text-white bg-dark">${c.name_jp}</div>
                        </div>
                        </div>
                    </div>
                `;
            }
            if (show.length == 0) {
                elParent.innerHTML = '<div class="alert alert-secondary">Horse in vacation.</div>';
            }
        }

        // search by name
        function searchHorse() {
            var keyword = elSearch.value.toLowerCase();
            show = horses.filter(function (c) {
                return (c.name_en || '').toLowerCase().includes(keyword);
            });
            page = 1;
            showPage();
        }

        // pagination
        function back() {
            var lastPage = Math.ceil(show.length / perPage);
            page -= 1;
            if (page == 0) {
                page = lastPage;
            }
            showPage();
        }

        function next() {
            var lastPage = Math.ceil(show.length / perPage);
            page += 1;
            if (page > lastPage) {
                page = 1;
            }
            showPage();
        }

        getUmamusume();

    </script>
</body>

</html>
